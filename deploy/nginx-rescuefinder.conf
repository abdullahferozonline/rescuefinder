# Save as $PREFIX/etc/nginx/conf.d/rescuefinder.conf after reviewing paths.
# This is a separate server block; do not replace your existing Caddyfile.
server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name rescuefinder.duckdns.org;

    root /data/data/com.termux/files/home/rescuefinder/web;
    index index.html;

    ssl_certificate     /data/data/com.termux/files/home/.acme.sh/rescuefinder.duckdns.org_ecc/fullchain.cer;
    ssl_certificate_key /data/data/com.termux/files/home/.acme.sh/rescuefinder.duckdns.org_ecc/rescuefinder.duckdns.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
